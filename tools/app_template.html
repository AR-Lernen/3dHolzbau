<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Holzbau AR</title>
<style>
  :root { --bg:#14171a; --panel:rgba(20,23,26,.86); --fg:#f2f4f5; --mut:#9aa4ab; --acc:#ffb347; --alt:#ff6a3d; --holz:#e0b060; --ok:#4cd68a; --bad:#ff6b6b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.35 system-ui,sans-serif; overflow:hidden; touch-action:none; }
  body.ar { background:transparent; }
  #ui > canvas#gl { pointer-events:none; }
  canvas#gl { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #ui > * { pointer-events:auto; }
  #touch { position:absolute; inset:0; touch-action:none; }
  .panel { background:var(--panel); border-radius:14px; padding:10px 12px; backdrop-filter:blur(6px); }
  #top { position:absolute; left:10px; right:10px; top:max(10px,env(safe-area-inset-top)); display:flex; gap:8px; align-items:flex-start; }
  #status { flex:1; min-width:0; }
  #status b { color:var(--acc); }
  #status small { color:var(--mut); display:block; }
  #bottom { position:absolute; left:10px; right:10px; bottom:max(10px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; color:var(--fg); background:#2b3238; border:1px solid #3a434b; border-radius:12px; padding:11px 14px; min-height:44px; }
  button:active { background:#3a434b; }
  button.pri { background:var(--acc); color:#1b1206; border-color:var(--acc); font-weight:600; }
  button.on { outline:2px solid var(--acc); }
  button[disabled] { opacity:.4; }
  button.sm { padding:6px 10px; min-height:36px; }
  .flex1 { flex:1; }
  label.chk { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; background:#2b3238; border-radius:10px; min-height:36px; }
  label.chk input { width:18px; height:18px; accent-color:var(--acc); }
  .sw { width:10px; height:10px; border-radius:3px; display:inline-block; }
  .hd { color:var(--mut); font-size:13px; font-weight:600; margin:10px 0 4px; }
  .grp { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:4px; }
  .it { display:inline-flex; gap:2px; }
  .it button { padding:0 8px; min-height:36px; border-radius:0 10px 10px 0; }
  .it label.chk { border-radius:10px 0 0 10px; }
  .it.cl button { background:var(--acc); color:#1b1206; }
  table.lay { border-collapse:separate; border-spacing:6px 4px; }
  table.lay th { font-weight:500; color:var(--mut); font-size:13px; text-align:left; }
  input[type=range] { width:100%; accent-color:var(--acc); height:28px; }
  .sl { display:grid; grid-template-columns:78px 1fr 44px; gap:8px; align-items:center; font-size:13px; color:var(--mut); }
  .sl span:last-child { color:var(--fg); text-align:right; }
  .hide { display:none !important; }
  body.menuOff #bottom, body.menuOff #layPanel, body.menuOff #stText, body.menuOff #planMini { display:none !important; }
  body.ar .previewOnly { display:none !important; }
  body:not(.ar) .arOnly { display:none !important; }
  #msg { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); text-align:center; max-width:80%; pointer-events:none; }
  #cross { position:absolute; left:50%; top:50%; width:34px; height:34px; margin:-17px 0 0 -17px; pointer-events:none; opacity:.9; display:none; }
  body.ar.aiming #cross { display:block; }
  #cross:before,#cross:after { content:""; position:absolute; background:#fff; box-shadow:0 0 3px #000; }
  #cross:before { left:16px; top:0; width:2px; height:34px; }
  #cross:after { top:16px; left:0; height:2px; width:34px; }
  .pad { display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(3,44px); gap:4px; }
  .pad button { padding:0; }
  details > summary { cursor:pointer; padding:6px 2px; color:var(--mut); list-style:none; }
  details > summary::-webkit-details-marker { display:none; }
  .err { color:var(--bad); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="touch" class="arOnly"></div>
  <div id="cross"></div>
  <div id="top">
    <div id="status" class="panel"><div id="planMini" class="hide" style="float:right;margin:0 0 4px 8px"></div><b id="stTitle">Vorschau</b><small id="stText"></small><small id="diag" style="font-size:12px"></small></div>
    <div style="display:flex;flex-direction:column;gap:6px"><button id="btnLay" class="sm">Ebenen</button><button id="btnMenu" class="sm arOnly">Menü ▾</button></div>
  </div>
  <div id="msg" class="panel hide"></div>

  <div id="bottom">
    <div id="layPanel" class="panel hide" style="max-height:50vh;overflow:auto">
      <div class="row" style="margin-bottom:8px">
        <button class="sm" data-pre="all">Alles</button><button class="sm" data-pre="holz">Nur Holzbau</button><button class="sm" data-pre="trag" id="preTrag">Tragwerk</button><button class="sm" data-pre="alt">Nur Altbau</button>
      </div>
      <div id="bauteile"></div>
      <div class="hd">Geschosse</div>
      <div class="row" id="floorRow"></div>
      <div class="hd">Seite aufschneiden <span style="font-weight:400">(✂ bei den Bauteilen wählen)</span></div>
      <div class="row" id="sideRow"><button class="sm" data-side="-X">−X</button><button class="sm" data-side="+X">+X</button><button class="sm" data-side="-Z">−Z</button><button class="sm" data-side="+Z">+Z</button></div>
      <div class="sl"><span>Tiefe</span><input id="slSide" type="range" min="0" max="100" value="40"><span id="vSide">40%</span></div>
      <div class="hd">Darstellung</div>
      <div class="sl"><span>Deckkraft</span><input id="slOp" type="range" min="5" max="100" value="60"><span id="vOp">60%</span></div>
      <div class="sl"><span>Schnitt oben</span><input id="slCut" type="range" min="0" max="100" value="100"><span id="vCut">aus</span></div>
      <div class="row" style="margin-top:6px">
        <label class="chk"><input id="chkEdges" type="checkbox" checked> Kanten</label>
        <label class="chk"><input id="chkXray" type="checkbox"> Röntgen (alle Kanten)</label>
      </div>
    </div>

    <!-- Vorschau: Fixpunkte im Modell wählen -->
    <div id="pvPanel" class="panel previewOnly">
      <button id="btnQuick" class="pri" style="width:100%;margin-bottom:8px" disabled>Schnellstart: Modell 1:1 in AR ansehen</button>
      <label class="chk" style="margin-bottom:8px"><input id="chkOvl" type="checkbox" checked> Kompatibilitätsmodus: Modell im Overlay zeichnen</label>
      <button id="btnARTable" style="width:100%;margin-bottom:10px" disabled>AR-Tisch 1:50 – fest auf dem Tisch</button>
      <div class="hd" style="margin-top:0">Referenzwand am Altbau (empfohlen)</div>
      <div class="row" id="pvWalls"></div>
      <div id="planPv" style="display:flex;justify-content:center;margin:6px 0"></div>
      <div class="row" style="margin-bottom:8px">
        <span style="color:var(--mut)">Fixpunkte im Modell:</span>
        <label class="chk"><input id="chk2" type="checkbox" checked> 2 Punkte</label>
      </div>
      <div class="row">
        <button id="pickA" class="flex1">A wählen</button>
        <button id="pickB" class="flex1">B wählen</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="btnAR" class="flex1" disabled>Mit Fixpunkten starten</button>
        <button id="btnClear" class="sm">Punkte löschen</button>
      </div>
      <small id="pvHint" style="color:var(--mut);display:block;margin-top:6px"></small>
    </div>

    <!-- AR -->
    <div id="wallPanel" class="panel arOnly hide">
      <div class="hd" style="margin-top:0">Referenzwand am Altbau wählen</div>
      <div id="planBox" style="display:flex;justify-content:center"></div>
      <div class="row" id="wallBtns" style="margin-top:6px"></div>
      <div class="row" style="margin-top:6px"><button class="sm" id="btnCustom">Eigene Punkte im Modell wählen</button><button class="sm" id="btnWallCancel">Abbrechen</button></div>
    </div>

    <div id="arPanel" class="panel arOnly">
      <div class="row" id="arSet">
        <button id="btnSet" class="pri flex1">setzen</button>
        <button id="btnUndo" class="sm">Zurück</button>
      </div>
      <div id="arAdj" class="hide">
        <div class="row" id="scaleRow" style="margin-bottom:8px"><span style="color:var(--mut)">Maßstab</span><button class="sm" data-sc="1">1:1</button><button class="sm" data-sc="0.04">1:25</button><button class="sm" data-sc="0.02">1:50</button><button class="sm" id="scM">−5 %</button><button class="sm" id="scP">+5 %</button></div>
        <div class="row" id="gestRow" style="margin-bottom:8px"><span style="color:var(--mut)">Finger</span><button class="sm flex1" data-gm="move">✋ Verschieben</button><button class="sm flex1" data-gm="rot">⟳ Drehen</button></div>
        <div class="sl" id="rotRow" style="margin-bottom:8px"><span>Drehung</span><input id="slRot" type="range" min="-180" max="180" step="1" value="0"><span id="vRot">0°</span></div>
        <div class="row" id="placeRow" style="margin-bottom:8px">
          <button id="btnFront" class="flex1">Modell vor mich setzen</button>
          <button id="btnPlace" class="flex1">Auf Fläche setzen</button>
          <button id="btnRealign" class="flex1">Exakt einpassen</button>
        </div>
        <div class="row" id="padRow" style="justify-content:space-between;align-items:center">
          <div class="pad">
            <span></span><button data-n="fwd">▲</button><span></span>
            <button data-n="left">◀</button><button id="btnStep" class="sm">1 cm</button><button data-n="right">▶</button>
            <span></span><button data-n="back">▼</button><span></span>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px">
            <button data-n="up" class="sm">Höhe ▲</button>
            <button data-n="down" class="sm">Höhe ▼</button>
            <button data-n="ccw" class="sm">↺ drehen</button>
            <button data-n="cw" class="sm">↻ drehen</button>
          </div>
        </div>
        <div class="row" style="margin-top:8px">
          <label class="chk" id="lblScale"><input id="chkScale" type="checkbox"> Maßstab aus Punkten</label>
          <button id="btnLock" class="sm">🔒 Fixieren</button>
          <button id="btnExit" class="sm">Beenden</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>/*THREE*/</script>
<script>
"use strict";
const MODEL = /*MODEL*/;
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('kar.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('kar.' + k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- Modell laden ----------
// Fotos aus dem Export (als JPEG eingebettet); UVs sind bereits in Kacheleinheiten
const IMGS = {};
function imgTex(key) {
  if (!IMGS[key]) {
    const tex = new THREE.TextureLoader().load('data:image/jpeg;base64,' + MODEL.imgs[key]);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.anisotropy = 4; tex.colorSpace = THREE.SRGBColorSpace; IMGS[key] = tex;
  }
  return IMGS[key];
}
const b64buf = s => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; };
const COLORS = { alt: 0xff6a3d, holz: 0x3fd6ff };
const offPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 1e6);   // schneidet nie
const sidePlane = new THREE.Plane(new THREE.Vector3(1, 0, 0), 1e6), localSide = new THREE.Plane();
const SWATCH = { alt: '#b4553d', holz: '#e0b060' };

const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.02, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(0.4, 1, 0.6); scene.add(sun);

const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e6);
const model = new THREE.Group();           // Alles, was ausgerichtet wird
scene.add(model);
const layers = [];                         // {type,floor,name,col,mesh,lines,occ,mats}
const faceMats = [], lineMats = [];
const mkOcc = () => new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, clippingPlanes: [cutPlane, offPlane] });
const toTA = (b, t) => t === 'u16' ? new Uint16Array(b64buf(b)) : new Uint32Array(b64buf(b));
for (const L of MODEL.layers) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(b64buf(L.p)), 3));
  g.setIndex(new THREE.BufferAttribute(toTA(L.i, L.it), 1));
  g.computeBoundingSphere();
  if (L.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(b64buf(L.uv)), 2));
  const m = new THREE.MeshLambertMaterial({ color: L.uv ? (L.tint ? new THREE.Color(...L.tint) : new THREE.Color(0xffffff)) : new THREE.Color(L.col), map: L.uv ? imgTex(L.img) : null, transparent: true, opacity: 0.6, side: THREE.DoubleSide, flatShading: true, depthWrite: false, clippingPlanes: [cutPlane, offPlane] });
  const mesh = new THREE.Mesh(g, m); mesh.renderOrder = 1; model.add(mesh); faceMats.push(m);
  const om = mkOcc(); const occ = new THREE.Mesh(g, om); occ.renderOrder = 0; model.add(occ);
  let lines = null; const mats = [m, om];
  if (L.ep) {
    const lg = new THREE.BufferGeometry();
    lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(b64buf(L.ep)), 3));
    lg.setIndex(new THREE.BufferAttribute(toTA(L.ei, L.eit), 1));
    const lm = new THREE.LineBasicMaterial({ color: COLORS[L.type], depthTest: true, transparent: true, opacity: 0.55, clippingPlanes: [cutPlane, offPlane] });
    lines = new THREE.LineSegments(lg, lm); lines.renderOrder = 2; model.add(lines); lineMats.push(lm); mats.push(lm);
  }
  layers.push({ type: L.type, floor: L.floor, name: L.name, col: L.col, mesh, lines, occ, mats });
}
const beacon = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 6, 10), new THREE.MeshBasicMaterial({ color: 0xffb347, depthTest: false, transparent: true, opacity: 0.9 }));
beacon.renderOrder = 7; model.add(beacon);
// Testwürfel: hängt fest vor der Kamera (nur AR) – zeigt, ob der 3D-Layer überhaupt dargestellt wird
const testCube = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.08), new THREE.MeshBasicMaterial({ color: 0xff00ff, depthTest: false }));
testCube.position.set(0, 0.12, -0.7); testCube.renderOrder = 20; testCube.visible = false; camera.add(testCube); scene.add(camera);
const DEBUG = /[?&]debug/.test(location.search);
const errs = []; addEventListener('error', e => errs.push(String(e.message).slice(0, 80)));
$('gl').addEventListener('webglcontextlost', () => { errs.push('3D-Ansicht abgestürzt (WebGL) – AR beenden und Seite neu laden'); });
$('gl').addEventListener('webglcontextrestored', () => { errs.push('3D-Ansicht wiederhergestellt'); });
renderer.debug.onShaderError = (gl, prog, vs, fs) => errs.push('Shader');
const bmin = new THREE.Vector3(...MODEL.min), bmax = new THREE.Vector3(...MODEL.max);
const bcen = bmin.clone().add(bmax).multiplyScalar(.5), bsize = bmax.clone().sub(bmin);
beacon.position.set(bcen.x, 3, bcen.z); beacon.visible = false;

// ---------- Ebenen-UI ----------
const floors = [...new Set(MODEL.layers.map(l => l.floor))];
const CFG = MODEL.cfg || {}, CLAD = CFG.cladding_names || [];
const order = CFG.floor_order || [];
$('preTrag').textContent = 'Tragwerk' + (CLAD.length ? ' (ohne ' + CLAD.join(' / ') + ')' : '');
floors.sort((a, b) => (order.indexOf(a) < 0 ? 9 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 9 : order.indexOf(b)));
const names = { alt: [], holz: [] }, colOf = {};
for (const l of layers) { if (!names[l.type].includes(l.name)) names[l.type].push(l.name); colOf[l.name] = l.col; }
const vis = store.get('visN', {}), fvis = store.get('visF', {}), clipSet = store.get('clip', {});
let side = store.get('side', '-X'), sideDepth = store.get('sideD', 40);
(function buildLayerUI() {
  let h = '';
  for (const [typ, title] of [['alt', 'Altbau'], ['holz', 'Holzbau']]) {
    h += '<div class="hd">' + title + '</div><div class="grp">';
    for (const n of names[typ]) h += '<span class="it" data-it="' + n + '"><label class="chk"><input type="checkbox" data-n="' + n + '"><span class="sw" style="background:' + colOf[n] + '"></span>' + n + '</label><button data-cut="' + n + '" title="Auf der gewählten Seite wegschneiden">✂</button></span>';
    h += '</div>';
  }
  $('bauteile').innerHTML = h;
  $('floorRow').innerHTML = floors.map(f => '<label class="chk"><input type="checkbox" data-f="' + f + '"> ' + f + '</label>').join('');
})();
function syncUI() {
  for (const cb of $('bauteile').querySelectorAll('input')) cb.checked = vis[cb.dataset.n] !== false;
  for (const cb of $('floorRow').querySelectorAll('input')) cb.checked = fvis[cb.dataset.f] !== false;
  for (const it of $('bauteile').querySelectorAll('.it')) it.classList.toggle('cl', !!clipSet[it.dataset.it]);
  for (const b of $('sideRow').querySelectorAll('button')) b.classList.toggle('on', b.dataset.side === side);
  $('slSide').value = sideDepth; $('vSide').textContent = sideDepth + '%';
}
function save() { store.set('visN', vis); store.set('visF', fvis); store.set('clip', clipSet); store.set('side', side); store.set('sideD', sideDepth); }
$('bauteile').addEventListener('change', e => { vis[e.target.dataset.n] = e.target.checked; save(); applyVis(); });
$('floorRow').addEventListener('change', e => { fvis[e.target.dataset.f] = e.target.checked; save(); applyVis(); });
$('bauteile').addEventListener('click', e => { const n = e.target.dataset && e.target.dataset.cut; if (!n) return; clipSet[n] = !clipSet[n]; save(); syncUI(); applyClip(); });
$('sideRow').addEventListener('click', e => { const s = e.target.dataset && e.target.dataset.side; if (!s) return; side = s; save(); syncUI(); updateCutPlane(); });
$('slSide').oninput = () => { sideDepth = +$('slSide').value; $('vSide').textContent = sideDepth + '%'; save(); updateCutPlane(); };
document.querySelector('#layPanel').addEventListener('click', e => {
  const k = e.target.dataset && e.target.dataset.pre; if (!k) return;
  for (const n of names.alt) vis[n] = k === 'all' || k === 'alt';
  for (const n of names.holz) vis[n] = !(k === 'alt' || (k === 'trag' && CLAD.includes(n)));
  save(); syncUI(); applyVis();
});
function applyClip() {                                      // pro Bauteil: Seitenebene an/aus (gleiche Plane-Anzahl → kein Neukompilieren)
  for (const l of layers) { const p = [cutPlane, clipSet[l.name] ? sidePlane : offPlane]; for (const m of l.mats) m.clippingPlanes = p; }
}
function applyVis() {
  for (const l of layers) {
    const on = vis[l.name] !== false && fvis[l.floor] !== false;
    l.mesh.visible = on; l.occ.visible = on && !$('chkXray').checked; if (l.lines) l.lines.visible = on && $('chkEdges').checked;
  }
}
function applyOpacity() {
  const o = +$('slOp').value / 100; $('vOp').textContent = Math.round(o * 100) + '%';
  for (const m of faceMats) m.opacity = o;
  store.set('opv12', $('slOp').value);
}
function applyCut() {
  const v = +$('slCut').value;                // 100 = aus
  $('vCut').textContent = v >= 100 ? 'aus' : ((bmin.y + (bsize.y * v / 100)).toFixed(2) + ' m');
  cutLocal = v >= 100 ? null : bmin.y + bsize.y * v / 100;
  updateCutPlane();
}
let cutLocal = null;
function updateCutPlane() {
  model.updateMatrixWorld(true);
  const f = sideDepth / 100, S = { '-X': [[1, 0, 0], -(bmin.x + f * bsize.x)], '+X': [[-1, 0, 0], bmax.x - f * bsize.x], '-Z': [[0, 0, 1], -(bmin.z + f * bsize.z)], '+Z': [[0, 0, -1], bmax.z - f * bsize.z] }[side];
  localSide.set(new THREE.Vector3(...S[0]), S[1]); sidePlane.copy(localSide).applyMatrix4(model.matrixWorld);
  if (cutLocal == null) { cutPlane.constant = 1e6; return; }
  const y = new THREE.Vector3(0, cutLocal, 0).applyMatrix4(model.matrixWorld).y;
  cutPlane.constant = y;                       // Ebene n=(0,-1,0): sichtbar ist y <= constant
}
$('slOp').value = store.get('opv12', 60); $('slOp').oninput = applyOpacity;
$('slCut').oninput = applyCut;
$('chkEdges').onchange = () => { applyVis(); };
$('chkXray').onchange = () => { for (const m of lineMats) { m.depthTest = !$('chkXray').checked; m.needsUpdate = true; } applyVis(); };
$('btnLay').onclick = () => $('layPanel').classList.toggle('hide');
syncUI(); applyClip(); applyVis(); applyOpacity(); applyCut();

// ---------- Referenzwände des Altbaus ----------
// Der Holzbau setzt sich an den Altbau. Sinnvoll ist daher, die Außenecken des Altbaus einzumessen.
const REF = MODEL.ref, ROLE_NAME = { anbau: 'Anbauwand', rueck: 'Rückwand', links: 'Seitenwand links', rechts: 'Seitenwand rechts' };
const ROLE_SUB = { anbau: 'hier setzt der Holzbau an', rueck: 'gegenüber dem Holzbau', links: 'links, vom Holzbau aus gesehen', rechts: 'rechts, vom Holzbau aus gesehen' };
const SIDE_N = { '-x': [-1, 0], '+x': [1, 0], '-z': [0, -1], '+z': [0, 1] };
const PLAN_LBL = { anbau: 'Anbauwand', rueck: 'Rückwand', links: 'Seite links', rechts: 'Seite rechts' };
const WALLS = {}; let VIEW_F = [0, 1], VIEW_R = [-1, 0];
(function buildWalls() {

function arTick(t, frame) {
